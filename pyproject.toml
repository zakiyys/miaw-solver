[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miaw-solver"
version = "1.0.1"
description = "Miaw Solver — self-hosted CAPTCHA solver, CPU-first, no GPU, no per-solve cost."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["captcha", "ocr", "ddddocr", "whisper", "self-hosted", "2captcha", "miaw-solver"]
classifiers = [
    "Development Status :: 3 - Alpha",   # sengaja Alpha: lihat README "Project status" — API stabil, cakupan engine belum
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "ddddocr==1.6.1",
    "pillow>=10",
    "numpy>=1.24",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
audio = ["faster-whisper>=1.0"]
grid = ["playwright>=1.40"]
all = ["miaw-solver[server,audio,grid]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "build>=1.2", "twine>=5"]

[project.scripts]
miaw-solve = "captcha_solver.cli:main"

[project.urls]
Homepage = "https://github.com/zakiyys/miaw-solver"
Source = "https://github.com/zakiyys/miaw-solver"
Issues = "https://github.com/zakiyys/miaw-solver/issues"

[tool.setuptools.packages.find]
include = ["captcha_solver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
